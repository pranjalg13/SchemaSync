# One command to a running SchemaSync: `docker compose up`.
# Verified against OrbStack (Docker CLI 29 / Compose v5).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: schemasync
      POSTGRES_USER: schemasync
      POSTGRES_PASSWORD: schemasync
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command:
      # log_lock_waits gives free server-side evidence for the lock-contention demo.
      - "postgres"
      - "-c"
      - "log_lock_waits=on"
      - "-c"
      - "deadlock_timeout=1s"
      - "-c"
      - "max_connections=100"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schemasync -d schemasync"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: ./backend
    environment:
      SCHEMASYNC_DB_URL: jdbc:postgresql://db:5432/schemasync
      SCHEMASYNC_DB_USER: schemasync
      SCHEMASYNC_DB_PASSWORD: schemasync
      # A fresh clone has no demo schema; create one so the first screen is something you can
      # branch rather than an empty state. Ignored once the schema exists.
      SCHEMASYNC_DEMO_SEED_ORDERS: "200000"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # So `web` waits for a server that actually answers, not just a started container.
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 20s

  web:
    build:
      context: ./web
    environment:
      # Must be the SERVICE name, not localhost. The Vite dev server proxies /api from inside this
      # container, where "localhost" is the web container itself -- so localhost:8080 gets a
      # connection refused, which reaches the browser as a 502 from the proxy.
      VITE_API_BASE: http://api:8080
    ports:
      - "5173:5173"
    volumes:
      # Mount the source so the running container always reflects the repo. Without this, editing
      # a file and restarting gives you the copy baked into the image, which looks like your change
      # silently did nothing. node_modules deliberately stays from the image.
      - ./web/src:/app/src
      - ./web/index.html:/app/index.html
      - ./web/vite.config.ts:/app/vite.config.ts
      - ./web/tsconfig.json:/app/tsconfig.json
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
