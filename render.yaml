# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
#
# Creates one free web service from the root Dockerfile. The database is Neon, so Render prompts for
# DATABASE_URL when you apply the Blueprint (sync: false keeps the secret out of this file).
#
# Paste Neon's DIRECT connection string -- the host WITHOUT "-pooler". In .env.local that is
# DATABASE_URL_UNPOOLED, not DATABASE_URL. Neon's pooled endpoint is PgBouncer in transaction mode,
# which drops the session settings and advisory locks the migration executor relies on.
services:
  - type: web
    name: schemasync
    runtime: docker
    plan: free
    # Neon project is in AWS us-east-2, which is Render's Ohio region: same region, lowest latency.
    region: ohio
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SCHEMASYNC_DEMO_SEED_ORDERS
        # 200k orders is about 30MB -- well inside Neon's free 0.5GB. Seeding only happens when the
        # demo schema does not exist yet, so redeploys never touch existing data.
        value: "200000"
